name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck      # game/ + Nuxt
      - run: npm test               # детерминизм, фаззинг, эксплойты, механики, данные, сеть
      - run: npm run assets:check   # каталог ассетов без скачивания
      - run: npm run generate       # статика игры собирается (без ассетов — процедурные модели)
